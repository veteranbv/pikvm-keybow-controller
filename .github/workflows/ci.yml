name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pull request validation only; every main run completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned CI tools
        # Exact versions with hashes; nothing resolves at install time.
        run: python -m pip install --require-hashes --no-deps -r .github/ci-requirements.txt

      - name: Check workflow action pinning and pull_request_target use
        run: python .github/scripts/check_workflow_pinning.py .github/workflows

      - name: Test the vendored review evaluator
        run: python -I .github/scripts/test_review_contract.py

      - name: Validate workflow syntax and embedded shell
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          "${RUNNER_TEMP}/actionlint/actionlint" -color

      - name: Audit workflow security
        # Offline static audit: privileged triggers, injection, credential
        # persistence and permissions. Intentional exceptions carry an inline
        # reason.
        run: zizmor --offline .github/workflows

      - name: Lint Python
        # Formatting is not enforced yet: four existing files differ from
        # ruff format.
        run: ruff check .

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/install.sh

      - name: Run tests
        # The tests extract the HTTPS functions from the controller with ast
        # and run them against a local TLS server. Nothing imports keybow,
        # GPIO or SPI, and no PiKVM is contacted.
        run: python -m unittest discover -s tests -v
